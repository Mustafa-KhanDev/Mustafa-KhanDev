<svg xmlns="http://www.w3.org/2000/svg" width="880" height="176" viewBox="0 0 880 176" role="img" aria-label="Tech stack: TypeScript, JavaScript, Node.js, React, Flutter, Laravel, PostgreSQL, Redis, Linux">
  <title>Tech stack</title>
  <style>
    :root {
      --tile: #111826; --tile-line: #1e2733;
      --icon: #ffd166; --label: #8b98a9;
      --accent: #ffd166;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --tile: #f7f3e8; --tile-line: #e0dccc;
        --icon: #c2601f; --label: #7a6a52;
        --accent: #c2601f;
      }
    }
    .head { font: 500 12px ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; letter-spacing: 4px; fill: var(--label); }
    .tile { fill: var(--tile); stroke: var(--tile-line); stroke-width: 1; }
    .ic { stroke: var(--icon); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icf { fill: var(--icon); }
    .txt { font: 800 20px ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; fill: var(--icon); }
    .lbl { font: 500 9.5px ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; letter-spacing: 1.5px; fill: var(--label); }
  </style>

  <text class="head" x="24" y="34">THE STACK</text>
  <rect x="24" y="44" width="120" height="2" fill="var(--accent)" opacity="0.85"/>

  <!-- TypeScript -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.1s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
    <rect class="tile" x="14" y="62" width="76" height="76" rx="13"/>
    <text class="txt" x="52" y="107" text-anchor="middle">TS</text>
    <text class="lbl" x="52" y="162" text-anchor="middle">TypeScript</text>
  </g>

  <!-- JavaScript -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.18s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.18s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
    <rect class="tile" x="111" y="62" width="76" height="76" rx="13"/>
    <text class="txt" x="149" y="107" text-anchor="middle">JS</text>
    <text class="lbl" x="149" y="162" text-anchor="middle">JavaScript</text>
  </g>

  <!-- Node.js -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.26s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.26s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
    <rect class="tile" x="208" y="62" width="76" height="76" rx="13"/>
    <g transform="translate(246,100)">
      <polygon class="ic" points="0,-17 14.7,-8.5 14.7,8.5 0,17 -14.7,8.5 -14.7,-8.5"/>
    </g>
    <text class="lbl" x="246" y="162" text-anchor="middle">Node.js</text>
  </g>

  <!-- React -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.34s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.34s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
    <rect class="tile" x="305" y="62" width="76" height="76" rx="13"/>
    <g transform="translate(343,100)">
      <ellipse class="ic" rx="18" ry="7"/>
      <ellipse class="ic" rx="18" ry="7" transform="rotate(60)"/>
      <ellipse class="ic" rx="18" ry="7" transform="rotate(120)"/>
      <circle class="icf" r="2.6"/>
    </g>
    <text class="lbl" x="343" y="162" text-anchor="middle">React</text>
  </g>

  <!-- Flutter -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.42s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.42s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
    <rect class="tile" x="402" y="62" width="76" height="76" rx="13"/>
    <g transform="translate(440,100)">
      <path class="ic" d="M -11 -9 L 1 3 L -11 15"/>
      <path class="ic" d="M 3 -9 L 15 3 L 3 15"/>
    </g>
    <text class="lbl" x="440" y="162" text-anchor="middle">Flutter</text>
  </g>

  <!-- Laravel -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.5s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
    <rect class="tile" x="499" y="62" width="76" height="76" rx="13"/>
    <g transform="translate(537,100)">
      <path class="ic" d="M -7 -13 L -7 11 L 13 11"/>
    </g>
    <text class="lbl" x="537" y="162" text-anchor="middle">Laravel</text>
  </g>

  <!-- PostgreSQL -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.58s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.58s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
    <rect class="tile" x="596" y="62" width="76" height="76" rx="13"/>
    <g transform="translate(634,100)">
      <ellipse class="ic" cx="0" cy="-9" rx="13" ry="5"/>
      <path class="ic" d="M -13 -9 V 9 A 13 5 0 0 0 13 9 V -9"/>
    </g>
    <text class="lbl" x="634" y="162" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- Redis -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.66s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.66s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
    <rect class="tile" x="693" y="62" width="76" height="76" rx="13"/>
    <g transform="translate(731,100)">
      <polygon class="ic" points="0,-16 6,-10 0,-4 -6,-10"/>
      <polygon class="ic" points="0,-5 6,1 0,7 -6,1"/>
      <polygon class="ic" points="0,6 6,12 0,18 -6,12"/>
    </g>
    <text class="lbl" x="731" y="162" text-anchor="middle">Redis</text>
  </g>

  <!-- Linux -->
  <g>
    <animate attributeName="opacity" from="0" to="1" begin="0.74s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.74s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
    <rect class="tile" x="790" y="62" width="76" height="76" rx="13"/>
    <g transform="translate(828,100)">
      <rect class="ic" x="-16" y="-13" width="32" height="26" rx="4"/>
      <path class="ic" d="M -9 -4 L -4 0 L -9 4"/>
      <path class="ic" d="M 1 4 H 8"/>
    </g>
    <text class="lbl" x="828" y="162" text-anchor="middle">Linux</text>
  </g>
</svg>
