<svg xmlns="http://www.w3.org/2000/svg" width="880" height="118" viewBox="0 0 880 118" role="img" aria-label="Stats: coding since 2022, 6 repositories, 7 languages, Karachi UTC+5">
  <title>Stats</title>
  <style>
    :root {
      --num: #e6edf3; --label: #5d6b80;
      --accent: #ffd166;
      --hairline: #1e2733;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --num: #22254a; --label: #7a6a52;
        --accent: #c2601f;
        --hairline: #dfe2da;
      }
    }
    .num { font: 700 30px "Segoe UI", Arial, Helvetica, sans-serif; letter-spacing: 1px; fill: var(--num); }
    .lbl { font: 500 10px ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; letter-spacing: 3px; fill: var(--label); }
    .dot { fill: var(--accent); }
    .hair { stroke: var(--hairline); stroke-width: 1; }
  </style>

  <line class="hair" x1="220" y1="30" x2="220" y2="88"/>
  <line class="hair" x1="440" y1="30" x2="440" y2="88"/>
  <line class="hair" x1="660" y1="30" x2="660" y2="88"/>

  <g>
    <text class="num" x="110" y="64" text-anchor="middle">2022</text>
    <circle class="dot" cx="110" cy="80" r="2"/>
    <text class="lbl" x="110" y="100" text-anchor="middle">CODING SINCE</text>
  </g>
  <g>
    <text class="num" x="330" y="64" text-anchor="middle">6</text>
    <circle class="dot" cx="330" cy="80" r="2"/>
    <text class="lbl" x="330" y="100" text-anchor="middle">REPOSITORIES</text>
  </g>
  <g>
    <text class="num" x="550" y="64" text-anchor="middle">7</text>
    <circle class="dot" cx="550" cy="80" r="2"/>
    <text class="lbl" x="550" y="100" text-anchor="middle">LANGUAGES</text>
  </g>
  <g>
    <text class="num" x="770" y="64" text-anchor="middle">UTC+5</text>
    <circle class="dot" cx="770" cy="80" r="2"/>
    <text class="lbl" x="770" y="100" text-anchor="middle">KARACHI</text>
  </g>
</svg>
