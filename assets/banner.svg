<svg xmlns="http://www.w3.org/2000/svg" width="830" height="260" viewBox="0 0 830 260" role="img" aria-label="Animated Karachi skyline — Mustafa Khan, full-stack developer">
  <title>MUSTAFA KHAN — Karachi skyline</title>
  <style>
    :root {
      --sky-top: #fff7ec;
      --sky-bottom: #ffe2ba;
      --skyline: #2f3350;
      --skyline-2: #3c3f63;
      --window: #ece2cc;
      --window-lit: #ffd166;
      --name: #22254a;
      --sub: #7a6a52;
      --accent: #c2601f;
      --celestial: #f08c4a;
      --star: #ffffff;
      --beacon: #e05252;
      --clockface: #fff7ec;
      --clockhand: #2f3350;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sky-top: #070b12;
        --sky-bottom: #0f1a2b;
        --skyline: #05080e;
        --skyline-2: #0a1018;
        --window: #1a2434;
        --window-lit: #ffd166;
        --name: #e6edf3;
        --sub: #8b98a9;
        --accent: #ffd166;
        --celestial: #e8edf4;
        --star: #ffffff;
        --beacon: #ff5c5c;
        --clockface: #ffd166;
        --clockhand: #05080e;
      }
    }
    .sky { fill: url(#skyGrad); }
    .g-top { stop-color: var(--sky-top); }
    .g-bot { stop-color: var(--sky-bottom); }
    .name { font: 700 34px ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; letter-spacing: 4px; fill: var(--name); }
    .sub { font: 400 14px ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; letter-spacing: 3px; fill: var(--sub); }
    .b1 { fill: var(--skyline); }
    .b2 { fill: var(--skyline-2); }
    .win { fill: var(--window); }
    .lit { fill: var(--window-lit); animation: win 7s ease-in-out infinite; }
    .d1 { animation-delay: 0s; } .d2 { animation-delay: 1.4s; }
    .d3 { animation-delay: 2.8s; } .d4 { animation-delay: 4.2s; }
    .star { fill: var(--star); animation: twinkle 3.2s ease-in-out infinite; }
    .s2 { animation-delay: .9s; } .s3 { animation-delay: 1.7s; } .s4 { animation-delay: 2.4s; }
    .beacon { fill: var(--beacon); animation: beacon 2.1s ease-in-out infinite; }
    .cursor { fill: var(--accent); animation: blink 1.1s steps(1) infinite; }
    .sun, .sun-halo { fill: var(--celestial); animation: breathe 9s ease-in-out infinite; }
    .sun-halo { opacity: .18; }
    .moon { fill: var(--celestial); }
    .f-clock { fill: var(--clockface); }
    .h-hand { stroke: var(--clockhand); stroke-width: 2.5; stroke-linecap: round; }
    .s-skyline { stroke: var(--skyline); }
    .f-car { fill: var(--skyline-2); }
    .f-light { fill: #ffd166; }
    .sun-g { } .moon-g { display: none; } .stars { display: none; }
    @media (prefers-color-scheme: dark) {
      .sun-g { display: none; } .moon-g { display: block; } .stars { display: block; }
    }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes win { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes beacon { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    @keyframes breathe { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="g-top"/>
      <stop offset="1" class="g-bot"/>
    </linearGradient>
    <mask id="crescent">
      <rect x="700" y="16" width="90" height="90" fill="black"/>
      <circle cx="740" cy="56" r="20" fill="white"/>
      <circle cx="749" cy="49" r="17" fill="black"/>
    </mask>
  </defs>

  <rect class="sky" width="830" height="260"/>

  <g class="stars">
    <circle class="star" cx="120" cy="40" r="1.6"/>
    <circle class="star s2" cx="205" cy="72" r="1.1"/>
    <circle class="star s3" cx="300" cy="30" r="1.4"/>
    <circle class="star s4" cx="486" cy="46" r="1.7"/>
    <circle class="star s2" cx="600" cy="26" r="1.2"/>
    <circle class="star s3" cx="660" cy="70" r="1.0"/>
  </g>

  <g class="sun-g">
    <circle class="sun-halo" cx="744" cy="54" r="27"/>
    <circle class="sun" cx="744" cy="54" r="17"/>
  </g>
  <g class="moon-g">
    <circle class="moon" cx="740" cy="56" r="20" mask="url(#crescent)"/>
    <polygon class="star s4" points="776,56 777.9,61.4 783.6,61.5 779.0,65.0 780.7,70.5 776,67.2 771.3,70.5 773.0,65.0 768.4,61.5 774.1,61.4"/>
  </g>

  <text class="name" x="44" y="66" textLength="292" lengthAdjust="spacingAndGlyphs">MUSTAFA KHAN</text>
  <rect class="cursor" x="344" y="40" width="14" height="32"/>
  <text class="sub" x="45" y="96">karachi · full-stack · building a city you can fight in</text>

  <!-- skyline -->
  <rect class="b2" x="8" y="150" width="64" height="110"/>
  <rect class="win" x="16" y="162" width="10" height="12"/>
  <rect class="lit d1" x="36" y="162" width="10" height="12"/>
  <rect class="win" x="56" y="162" width="10" height="12"/>
  <rect class="lit d3" x="16" y="186" width="10" height="12"/>
  <rect class="win" x="36" y="186" width="10" height="12"/>
  <rect class="lit d2" x="56" y="186" width="10" height="12"/>
  <rect class="win" x="16" y="210" width="10" height="12"/>
  <rect class="lit d4" x="36" y="210" width="10" height="12"/>
  <rect class="win" x="56" y="210" width="10" height="12"/>

  <!-- Mazar-e-Quaid -->
  <rect class="b1" x="86" y="170" width="120" height="90"/>
  <rect class="b1" x="76" y="222" width="140" height="38"/>
  <path class="b1" d="M96 172 C96 138 122 124 146 124 C170 124 196 138 196 172 Z"/>
  <rect class="b1" x="144" y="108" width="4" height="18"/>
  <circle class="b1" cx="146" cy="106" r="3"/>
  <rect class="win" x="104" y="192" width="10" height="14"/>
  <rect class="lit d2" x="130" y="192" width="10" height="14"/>
  <rect class="win" x="156" y="192" width="10" height="14"/>
  <rect class="lit d4" x="182" y="192" width="10" height="14"/>
  <rect class="lit d1" x="104" y="218" width="10" height="14"/>
  <rect class="win" x="130" y="218" width="10" height="14"/>
  <rect class="lit d3" x="156" y="218" width="10" height="14"/>
  <rect class="win" x="182" y="218" width="10" height="14"/>

  <!-- Empress Market clock tower -->
  <rect class="b1" x="226" y="112" width="44" height="148"/>
  <polygon class="b1" points="226,112 270,112 248,94"/>
  <circle class="f-clock" cx="248" cy="140" r="13"/>
  <line class="h-hand" x1="248" y1="140" x2="248" y2="130">
    <animateTransform attributeName="transform" type="rotate" from="0 248 140" to="360 248 140" dur="48s" repeatCount="indefinite"/>
  </line>
  <line class="h-hand" x1="248" y1="140" x2="257" y2="140">
    <animateTransform attributeName="transform" type="rotate" from="0 248 140" to="360 248 140" dur="576s" repeatCount="indefinite"/>
  </line>
  <rect class="lit d2" x="238" y="172" width="20" height="11"/>
  <rect class="win" x="238" y="198" width="20" height="11"/>
  <rect class="lit d4" x="238" y="224" width="20" height="11"/>

  <!-- Habib Bank Plaza tower + antenna -->
  <rect class="b2" x="292" y="64" width="58" height="196"/>
  <rect class="b2" x="306" y="52" width="30" height="12"/>
  <line class="s-skyline" x1="321" y1="52" x2="321" y2="20" stroke-width="3"/>
  <circle class="beacon" cx="321" cy="18" r="4"/>
  <rect class="win" x="300" y="80" width="7" height="11"/>
  <rect class="lit d1" x="311" y="80" width="7" height="11"/>
  <rect class="win" x="311" y="102" width="7" height="11"/>
  <rect class="win" x="322" y="124" width="7" height="11"/>
  <rect class="lit d3" x="333" y="146" width="7" height="11"/>
  <rect class="win" x="300" y="146" width="7" height="11"/>
  <rect class="lit d2" x="300" y="168" width="7" height="11"/>
  <rect class="win" x="311" y="190" width="7" height="11"/>
  <rect class="lit d4" x="322" y="212" width="7" height="11"/>
  <rect class="win" x="333" y="234" width="7" height="11"/>

  <rect class="b1" x="366" y="150" width="84" height="110"/>
  <rect class="win" x="378" y="164" width="10" height="13"/>
  <rect class="lit d3" x="400" y="164" width="10" height="13"/>
  <rect class="win" x="422" y="164" width="10" height="13"/>
  <rect class="lit d1" x="378" y="190" width="10" height="13"/>
  <rect class="win" x="400" y="190" width="10" height="13"/>
  <rect class="lit d2" x="422" y="190" width="10" height="13"/>
  <rect class="win" x="378" y="216" width="10" height="13"/>
  <rect class="lit d4" x="400" y="216" width="10" height="13"/>

  <rect class="b2" x="462" y="132" width="64" height="128"/>
  <rect class="lit d2" x="472" y="146" width="9" height="13"/>
  <rect class="win" x="494" y="146" width="9" height="13"/>
  <rect class="win" x="516" y="146" width="9" height="13"/>
  <rect class="win" x="472" y="172" width="9" height="13"/>
  <rect class="lit d4" x="494" y="172" width="9" height="13"/>
  <rect class="win" x="516" y="198" width="9" height="13"/>
  <rect class="lit d1" x="472" y="224" width="9" height="13"/>

  <!-- construction crane -->
  <rect class="b1" x="556" y="96" width="10" height="164"/>
  <rect class="b1" x="549" y="88" width="24" height="10"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 561 93; 4 561 93; -4 561 93" dur="18s" repeatCount="indefinite"/>
    <rect class="b1" x="561" y="91" width="74" height="4"/>
    <rect class="b1" x="517" y="91" width="44" height="4"/>
    <rect class="b1" x="519" y="95" width="20" height="12"/>
    <line class="s-skyline" x1="629" y1="95" x2="629" y2="124" stroke-width="1.5"/>
    <rect class="b1" x="625" y="124" width="8" height="9"/>
  </g>

  <rect class="b1" x="596" y="170" width="72" height="90"/>
  <rect class="win" x="608" y="184" width="10" height="13"/>
  <rect class="lit d1" x="630" y="184" width="10" height="13"/>
  <rect class="win" x="652" y="184" width="10" height="13"/>
  <rect class="lit d3" x="608" y="210" width="10" height="13"/>
  <rect class="win" x="630" y="210" width="10" height="13"/>

  <rect class="b2" x="680" y="142" width="60" height="118"/>
  <rect class="lit d2" x="690" y="156" width="10" height="13"/>
  <rect class="win" x="712" y="156" width="10" height="13"/>
  <rect class="win" x="734" y="156" width="10" height="13"/>
  <rect class="win" x="690" y="182" width="10" height="13"/>
  <rect class="lit d4" x="712" y="182" width="10" height="13"/>
  <rect class="win" x="712" y="208" width="10" height="13"/>

  <rect class="b1" x="752" y="160" width="70" height="100"/>
  <rect class="win" x="764" y="174" width="10" height="13"/>
  <rect class="lit d1" x="786" y="174" width="10" height="13"/>
  <rect class="win" x="808" y="174" width="10" height="13"/>
  <rect class="lit d3" x="764" y="200" width="10" height="13"/>
  <rect class="win" x="786" y="200" width="10" height="13"/>

  <rect class="b1" x="0" y="246" width="830" height="14"/>

  <!-- traffic -->
  <g transform="translate(0,234)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-80 0" to="920 0" dur="8.5s" repeatCount="indefinite"/>
      <rect class="f-car" x="0" y="0" width="24" height="8" rx="2"/>
      <rect class="f-car" x="6" y="-4" width="11" height="5" rx="1"/>
      <circle class="f-light" cx="23" cy="5" r="2.2"/>
    </g>
  </g>
  <g transform="translate(0,222)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="920 0" to="-80 0" dur="13s" repeatCount="indefinite"/>
      <g transform="scale(-1 1)">
        <rect class="f-car" x="0" y="0" width="24" height="8" rx="2"/>
        <rect class="f-car" x="6" y="-4" width="11" height="5" rx="1"/>
        <circle class="f-light" cx="23" cy="5" r="2.2"/>
      </g>
    </g>
  </g>
</svg>
